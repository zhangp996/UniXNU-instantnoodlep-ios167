schema_version = 2

[board]
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ios-16.7.16-20H392"
description = "OnePlus 8 Pro (IN2020): SM8250 (kona), 1440x3168 DSC panel, S6SY791 touch; iOS 16.7.16 (20H392) arm64 target"
kit = "instantnoodlep"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "GopFramebuffer", "RamBlock", "AppleKeyStoreState"]

[kernel]
defconfig = "instantnoodlep_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ios.config"]
# iOS 16.7.16 builds on xnu-8796.141.3 (donor kernelcache xnu-8796.142.1.703.8, Darwin 22.6.0).
# The shared arm64 series targets xnu-10063 and does not apply to 8796; the rebased 8796
# series (95 entries, strict git apply verified on the real 8796.141.3 tree) lives in this
# repository, migrated 2026-11-20 from the baseline archive
# UniXNU-instantnoodlep-ios167 r2/device/patches/xnu-8796 (see porting.toml, configuration).
# The OS profile series carries the seven 8796/Linux-toolchain fixes and applies after it.
patch_series = ["device:patches/xnu-8796/series", "os:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:RamBlock",
  "component:AppleKeyStoreState",
]

[device_tree]
source = "device:dts/instantnoodlep.dts"
include_dirs = ["soc:dts"]

[ipsw]
# The restore image is not redistributable; point the build at a local copy with --ipsw.
product = "iPhone10,6"
version = "16.7.16"
build = "20H392"
device_class = "d221ap"
chip_id = 0x8015
board_id = 0x0E

[firmware]
# uefi-instantnoodlep: device package written from scratch for this port. SoC plumbing is
# upstream KonaPkg; board DSC/FDF/MemoryMapLib/ConfigurationMapLib are authored here from
# measured IN2020 facts (FD 0x9E400000/4 MiB, 1440x3168). Only data is taken: the firmware DTB and
# the IN2020 XBL driver blobs. Merge onto a Mu-Silicium checkout, then point --uefi at it.
config = "instantnoodlep"
dsc = "Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc"
fd = "Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{uefi}/Platforms/OnePlus", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# MuPatches present in the Mu-Silicium base (AsmMacroLib was upstreamed and is gone).
patches = ["Resources/MuPatches/Auth-Service.patch", "Resources/MuPatches/Boot-Manager.patch", "Resources/MuPatches/Timer.patch", "Resources/MuPatches/Usb-Bus.patch"]

[firmware.defines]
ENABLE_SECUREBOOT = "0"
DEVICE_MODEL = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "instantnoodlep-unixnu"

[bootimg.image]
# Validated boot-menu.img header (2026-11-17, enters the menu): v2, kaddr 0x8000,
# raddr 0x1000000, tags 0x100, page 4096, base 0, cmdline
# "console=ttyMSM0,115200n8 androidboot.hardware=qcom", and the stock boot DTB
# (11,028,247 B) in the v2 dtb field at 0x1f00000 — NOT appended to the kernel.
# The unixnu bootimg append-dtb path does not reproduce that transport yet;
# menu images are hand-packed with mkbootimg.py --dtb --dtb_offset 0x1f00000
# (see uefi-instantnoodlep docs/FACTS.md). A v1 image with the DTB appended and
# FD at 0x9F000000 hung at the logo on 2026-11-20.
header_version = 2
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x01000000
tags_offset = 0x100
pagesize = 4096
# Validated boot-menu.img stores the raw BootShim+FD (not gzip): the OnePlus ABL
# mishandles the compressed stream, so use the uncompressed transport.
kernel_compression = "none"

[userdata]
# GPT userdata on this unit: first_lba from the stock GPT (last partition, auto-expands),
# size from fastboot partition-size:userdata = 0x1928453000, 4096-byte logical blocks.
first_lba = 4133800
last_lba = 30513146
lba_bytes = 4096

[payload]
volume = "IN2020"
size_mib = 192
loader = "firmware"
title = "iOS 16.7.16"
dram_size = "0x200000000"
timeout = 3
kernel_args = ["-v", "serial=3"]

[payload.adt]
chip_id = "0x8015"
unique_chip_id = "required"

[package]
unixnu = "../src/UniXNU"

[package.defconfig]
"ios-16.7.16-20H392" = "instantnoodlep_defconfig"
