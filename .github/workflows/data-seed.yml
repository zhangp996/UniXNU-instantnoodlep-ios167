name: data-seed

# Create the first-install APFS Data seed for instantnoodlep (iOS 16.7.16 / 20H392) on a
# macOS runner (hdiutil/diskutil are macOS-only). Run in the fork with Actions enabled and
# the UNIXNU_UNIQUE_CHIP_ID secret set; download the artifact, then delete the run. The seed
# is installation state derived from the Apple IPSW: keep it for subsequent builds.
#
# Docs: guide/userdata.md step 4, scripts/make-data-seed.py, scripts/seed-data-grow.py.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "20H392 restore IPSW URL (Apple firmware server or a hosted copy)"
        required: true
      gib:
        description: "Data seed container size in GiB (3..1024)"
        required: true
        default: "8"
      skip_setup:
        description: "Mark Setup as done in the seed"
        type: boolean
        default: true
      unixnu_ref:
        description: "zhangp996/UniXNU ref carrying the ios-16.7.16-20H392 OS profile"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: data-seed-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  seed:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out UniXNU (fork with the OS profile)
        uses: actions/checkout@v4
        with:
          repository: zhangp996/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: brew install dtc mtools blacktop/tap/ipsw

      - name: Check inputs
        env:
          GROW_GIB: ${{ inputs.gib }}
        run: |
          [[ "$GROW_GIB" =~ ^[0-9]+$ ]] || { echo "::error::gib must be a whole number"; exit 1; }
          [ -f device/board.toml ] || { echo "::error::device board.toml missing"; exit 1; }
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch the IPSW OS disk image
        working-directory: UniXNU
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "::add-mask::$IPSW_URL"
          python3 unixnu ipsw fetch OS --ipsw "$IPSW_URL" --out out -D ../device
          ls -la out/ipsw/20H392/

      - name: Create the Data seed
        working-directory: UniXNU
        env:
          GROW_GIB: ${{ inputs.gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          git submodule update --init --depth 1 drivers/DarwinBoot
          OS_DMG=out/ipsw/20H392/087-86698-044.dmg
          MOUNT="$RUNNER_TEMP/os-mount"
          mkdir -p "$MOUNT" build
          hdiutil attach -readonly -nobrowse -owners off -mountpoint "$MOUNT" "$OS_DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          args=(--gib "$GROW_GIB" --build 20H392)
          if [ "$SKIP_SETUP" = true ]; then args+=(--skip-setup); fi
          python3 scripts/make-data-seed.py "$MOUNT" "$RUNNER_TEMP/data.dbr" "${args[@]}"
          ls -la "$RUNNER_TEMP/data.dbr"

      - name: Upload the Data seed
        uses: actions/upload-artifact@v4
        with:
          name: data-seed-20H392
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/data.dbr

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf UniXNU/out/ipsw
          rm -f "$RUNNER_TEMP/data.dbr"
