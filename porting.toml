next_action = ["Boot the firmware to the menu and read the CPU bring-up log."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = ["RamBlock"]
paths = ["dts/instantnoodlep.dts"]
inputs = ["Identify the memory and dma hardware, resources and existing component interfaces for this board."]
configuration = ["Board DTS declares 8 GiB at 0x80000000; payload dram_size is 0x200000000; RamBlock provides the RAM block device for first bring-up."]
procedure = ["unixnu payload -D ../UniXNU-instantnoodlep --unique-chip-id <seed>"]
findings = ["The DRAM size is the 8 GiB SKU value and has not been confirmed on this unit: confirm from /proc/meminfo on Android or the ABL log."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["DRAM size unverified; no device run."]
next_action = ["Confirm DRAM size on the unit."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = ["RamBlock", "AppleKeyStoreState"]
paths = ["dts/instantnoodlep.dts", "configs/instantnoodlep_defconfig"]
inputs = ["Identify the storage and root hardware, resources and existing component interfaces for this board."]
configuration = ["defconfig keeps CONFIG_XNU_NATIVE_UFS off; the SoC dtsi carries the UFS host 0x1d84000 (+0x1d90000 ICE, SPI 265) and PHY 0x1d87000 but both nodes stay disabled."]
procedure = ["No storage build: the catalog has no SM8250 UFS component, and ShengUfs is SM8750-scoped."]
findings = ["Without a storage component the root and Data volumes cannot mount, so launchd cannot start even if the kernel links."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Blocked: no kona UFS driver in the catalog or in UniXNU-sm8250-common (kits/ is empty)."]
next_action = ["Write a kona UFS component against the UFS guide, or select ShengUfs only after auditing it for SM8250."]
evidence = []

