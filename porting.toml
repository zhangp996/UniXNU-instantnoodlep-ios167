schema_version = 1

[device]
name = "instantnoodlep"
soc = "SM8250"
os_profile = "ios-16.7.16-20H392"
summary = "OnePlus 8 Pro (IN2020), SM8250 kona, iOS 16.7.16 (20H392) arm64 target. Configuration layer resolves; kernel series, storage component and firmware package are the open gates."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "local.toml", "configs/**", "dts/**"]
inputs = ["Identify the configuration hardware, resources and existing component interfaces for this board."]
configuration = ["board.toml selects SoC source sm8250 (zhangp996/UniXNU-sm8250-common @3481a8b) and OS profile ios-16.7.16-20H392; kernel.defconfig is instantnoodlep_defconfig; device_tree.source is device:dts/instantnoodlep.dts with soc:dts include."]
procedure = ["unixnu defconfig instantnoodlep_defconfig -D ../UniXNU-instantnoodlep; unixnu status --json -D ../UniXNU-instantnoodlep; porting-record.py check."]
findings = ["status resolves the arm64 profile, the local sm8250 SoC source and 56 arch patches in order. No catalog component declares ios-16.7.16 in os_abi: every selected component lists ipados-17.7.11-21H461 only, so the Darwin 22 ABI is unverified.", "2026-11-20: this repository owns the xnu-8796 patch layer (patches/xnu-8796, 95-entry series); the OS profile carries the complete measured profile.toml plus the seven 8796/Linux-toolchain fixes. Strict sequential git apply verified 101/101 against the freshly fetched xnu-8796.141.3 @1b191cb. board.toml patch_series is device:patches/xnu-8796/series + os:patches/xnu/series; the xnu-10063 arch series is no longer selected for this OS.", "The kernel rebuild uses a fresh environment per docs/building.md: toolchain installed to /opt/unixnu-fresh via scripts/linux/setup-toolchain.py (UNIXNU_TOOLCHAIN), sources fetched by unixnu fetch into /root/uxout-new (xnu-8796.141.3 @1b191cb per profile pin). The discarded WSL R2 tree (/root/unixnu) is not referenced.", "Build-hygiene lesson (2026-11-20): after adding the -MJ compile-record flag to MakeInc.rule, objects compiled earlier carry no .o.json and make treats them as up to date; the unixnu bootstrap tolerance condition (startup.o.json + kernel headers) then fails. Removing every .o lacking its .o.json forces recompilation with records. Also CONFIG_XNU_BUILD_ARCHIVES=y is required for the final link to include the [kernel] archives (mockfs/verified-root symbols)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["The shared arm64 patch series targets xnu-10063; nothing in this repository has been built for xnu-8796 yet."]
next_action = ["Run ./unixnu build kernel with UNIXNU_TOOLCHAIN=/opt/unixnu-fresh and --out /root/uxout-new; record patch application, link and prelink results."]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "scripts/package.sh"]
inputs = ["Identify the firmware and boot hardware, resources and existing component interfaces for this board."]
configuration = ["[firmware] names Platforms/OnePlus/instantnoodlepPkg/instantnoodlep.dsc, Build/instantnoodlepPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, and a 192 MiB payload volume IN2020."]
procedure = ["unixnu build firmware --uefi <Mu-Silicium + instantnoodlepPkg> -D ../UniXNU-instantnoodlep --target DEBUG"]
findings = ["uefi-instantnoodlep now exists: a from-scratch Mu-Silicium device package (upstream KonaPkg, authored DSC/FDF/MemoryMapLib, taken IN2020 XBL blobs + DTB); it builds SILICIUM_UEFI.fd on WSL (2026-11-20).", "First rebuild used the stock-uefi_secapp window 0x9F000000/3 MiB with a header-v1 image and the 939,951 B firmware DTB appended to the kernel: fastboot boot hung at the logo, no CDC console in 90 s (2026-11-20).", "The validated boot-menu.img (2026-11-17) decodes to: BootShim text_offset 0x9E400000, 4 MiB FD, header v2, cmdline console=ttyMSM0,115200n8 androidboot.hardware=qcom, stock boot DTB (11,028,247 B) in the dtb field at 0x1f00000. Config/MemoryMapLib corrected to that window (uefi-instantnoodlep b6fb058).", "Second rebuild with the corrected window and the validated transport (packing proven byte-identical to boot-menu.img using the validated FD) runs the firmware but hangs before the menu: garbled overlapping debug lines on the panel, no CDC in 90 s. Diff against the validated R2 overlay shows the from-scratch package lost measured board facts: framebuffer PCDs must be 1080x2376 (ABL's mode, not the 1440x3168 panel), DXE heap must be executable at 0x9E800000 (XN faults the first driver jump), DxeCore needs carved free spans, no vendor XBL DXE binaries (they abort), KonaKeysDxe instead of ButtonsDxe, BDS health-check GUID zeroed. Full delta: uefi-instantnoodlep docs/FACTS.md.", "Rebuilding from the R2 overlay itself to reproduce the menu; the authored package then absorbs the R2 facts.", "Authored package device-verified 2026-11-20 (uefi-instantnoodlep 0dea68d): menu + keys. Fatal delta was the bare Sec.inf redeclaration in the DSC dropping the .inc's NULL|LzmaCustomDecompressLib override (SEC LZMA handler never registered); base-only bisect rounds excluded MemoryMapLib and FDF first. FD/FV PCDs now declared in the DSC as well."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Menu-only image: no payload/boot entry yet (menu reports 'no boot entry found', drivers 0/0). Kernel/payload gates remain: 8796 series build, 20H392 storage ABI audit, AMFI call sites, Data seed UUID (macOS)."]
next_action = ["Build the kernel with the rebased series, then payload + boot image with a real boot entry; keep the authored firmware (0dea68d) as the validated transport."]
evidence = [
  { kind = "device", command = "fastboot boot inputs/menu/boot-menu.img (0x9F000000/3 MiB FD, header v1, DTB appended); capture_eu.ps1 90 s", revision = "7d23398367cdfa800a13372f1b510021876ce4e8", reference = "docs/evidence/2026-11-20-menu-rebuilt-firmware.log", result = "Logo hang; no USB CDC console (VID_1209&PID_316D) within 90 s; device fell back to fastboot. Log: docs/evidence/2026-11-20-menu-rebuilt-firmware.log." },
  { kind = "device", command = "fastboot boot inputs/menu/boot-menu-v2.img (0x9E400000/4 MiB FD, header v2, stock_boot.dtb dtb field); capture_eu.ps1 90 s", revision = "b6fb058c4a0097273077c9cff271741fa0c7ef58", reference = "docs/evidence/2026-11-20-menu-v2-validated-window.log", result = "Firmware runs (SEC/DXE debug lines on panel, garbled by the 1440x3168 framebuffer PCDs) but hangs before the menu; no CDC in 90 s. Packing sanity: same pipeline with the validated FD reproduces boot-menu.img byte-for-byte. Log: docs/evidence/2026-11-20-menu-v2-validated-window.log; screen photo observed by operator." },
  { kind = "device", command = "fastboot boot inputs/menu/boot-menu-authored.img (authored package, FD sha256 1156aa43...); operator screen/key check", revision = "0dea68da14293ebb69ea253bc88aaf6b7fef720c", reference = "docs/evidence/2026-11-20-menu-authored-secfix.log", result = "Authored package device-verified: UniXNU menu (version 0.1.0, built-in configuration, four actions, 'no boot entry found' as expected without payload), volume/power keys work (operator-confirmed 2026-11-20). Fatal delta fixed: bare Sec.inf redeclaration in the DSC dropped SiliciumPkg.dsc.inc's NULL|LzmaCustomDecompressLib override; two base-only bisect rounds excluded memory map and FDF first. Log: docs/evidence/2026-11-20-menu-authored-secfix.log." },
]

